services:
  hercules_runtime:
    build:
      context: .
      dockerfile: Dockerfile
    healthcheck:
      # control_server.py's /healthz only returns 200 once its own s3270 subprocess can actually
      # connect to Hercules's 3270 listener (not just "the control server process is up") -- see
      # that module's docstring. start_period is generous because a cold MVS 3.8j IPL (ipl 148 ->
      # IEA101A reply -> JES2/VTAM/TCAS init) takes ~20-30s.
      test: ["CMD", "curl", "-f", "http://localhost:3271/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 45s
